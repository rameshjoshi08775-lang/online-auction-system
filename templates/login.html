{% extends "base.html" %}
{% block title %}Login - BidSquare{% endblock %}
{% block content %}
<div class="panel narrow">
  <h1>Welcome back</h1>
  <p class="muted">Sign in to continue to your auctions.</p>
  <form method="post">
    <label>Username <input name="username" required></label>
    <label>Password <input name="password" type="password" required></label>
    <button type="submit">Login</button>
  </form>
  <p class="muted small">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
